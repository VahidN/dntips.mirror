name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inject Google Analytics
        env:
          GA_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          python3 -c '
          import os, sys

          ga_id = os.environ.get("GA_ID")
          if not ga_id:
              print("GA_ID is empty or missing! Check repository secrets.", file=sys.stderr)
              sys.exit(1)

          snippet = f"""<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={ga_id}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag("js", new Date());
            gtag("config", "{ga_id}");
          </script>
          </head>"""

          target_dir = "OPF"
          for root, _, files in os.walk(target_dir):
              for file in files:
                  if file.endswith(".html"):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()

                      if "googletagmanager.com" not in content and "</head>" in content:
                          content = content.replace("</head>", snippet, 1)
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(content)
          '
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: OPF

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
