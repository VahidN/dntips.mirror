name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inject Google Analytics, Search Box, and Table Row
        env:
          GA_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
        run: |
          python3 - <<'PY'
          import os, re

          ga_id = os.environ.get("GA_ID")
          cse_cx = os.environ.get("CSE_CX")

          ga_snippet = f"""<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={ga_id}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag("js", new Date());
            gtag("config", "{ga_id}");
          </script>
          </head>"""

          # قطعه‌کد جستجو متناسب با قرارگیری در داخل ستون بوت‌استرپ
          search_snippet = f"""\n<!-- Google Custom Search Box -->
          <div class="mt-4">
            <style>
              .gsc-control {{ width: 100%; }}
              form.gsc-search-box {{ max-width: 100%; }}
            </style>
            <script async src="https://cse.google.com/cse.js?cx={cse_cx}">
            </script>
            <div class="gcse-search"></div>
          </div>
          """

          # ردیف جدید برای افزودن به انتهای جدول
          telegram_row = """
          <tr>
          <td>
           <a dir="ltr" href="https://t.me/+A5caPziuZX5jYTY0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="17" height="17">
              <circle cx="12" cy="12" r="12" fill="#24A1DE"/>
              <path fill="#FFFFFF" d="M17.5 7.4L15.4 17.3C15.2 18 14.8 18.2 14.2 17.9L10.9 15.4L9.3 17C9.1 17.2 9 17.3 8.6 17.3L8.8 14L14.9 8.5C15.2 8.2 14.8 8.1 14.5 8.3L7 13L3.8 12C3.1 11.8 3.1 11.3 4 11L16.5 6.2C17.1 6 17.6 6.3 17.5 7.4Z"/>
            </svg>
            @dntipsnews
           </a>
          </td>
          </tr>
          """

          target_dir = "OPF"

          col_regex = re.compile(r"(<div[^>]*class=[\"\'][^\"\']*\bcol-md-10\b[^\"\']*[\"\'][^>]*>)", re.IGNORECASE)
          body_regex = re.compile(r"(<body[^>]*>)", re.IGNORECASE)
          # یافتن جدول با کلاس‌های مشخص‌شده تا انتهای بسته شدن جدول
          table_regex = re.compile(
              r'(<table[^>]*class=["\'][^"\']*table shadow-sm mb-0 rounded table-hover mx-auto w-100 caption-bottom[^"\']*["\'][^>]*>)(.*?)(</table>)',
              re.IGNORECASE | re.DOTALL
          )

          def append_row_to_table(match):
              open_tag, inner_html, close_tag = match.group(1), match.group(2), match.group(3)
              # اگر از قبل لینک تلگرام وجود داشت، تغییر نده
              if "+A5caPziuZX5jYTY0" in inner_html:
                  return match.group(0)
              # اگر جدول دارای تگ <tbody> بود، ردیف را قبل از بستن آخرین </tbody> بگذار
              if re.search(r"</tbody>", inner_html, re.IGNORECASE):
                  inner_html = re.sub(r"(</tbody>)(?![\s\S]*</tbody>)", telegram_row + r"\1", inner_html, count=1, flags=re.IGNORECASE)
              else:
                  inner_html = inner_html + telegram_row
              return open_tag + inner_html + close_tag

          for root, _, files in os.walk(target_dir):
              for file in files:
                  if file.endswith(".html"):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()

                      modified = False

                      # 1. تزریق GA
                      if ga_id and "googletagmanager.com" not in content and "</head>" in content:
                          content = content.replace("</head>", ga_snippet, 1)
                          modified = True

                      # 2. تزریق کادر جستجو
                      if file != "search.html" and cse_cx and "cse.google.com/cse.js" not in content:
                          if col_regex.search(content):
                              content = col_regex.sub(r"\1" + search_snippet, content, count=1)
                              modified = True
                          elif body_regex.search(content):
                              content = body_regex.sub(r"\1" + search_snippet, content, count=1)
                              modified = True

                      # 3. افزودن ردیف تلگرام به انتهای جدول مورد نظر
                      if "+A5caPziuZX5jYTY0" not in content and table_regex.search(content):
                          content = table_regex.sub(append_row_to_table, content, count=1)
                          modified = True

                      if modified:
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(content)
          PY

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: OPF

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
